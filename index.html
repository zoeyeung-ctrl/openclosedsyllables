<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open & Closed Syllables - The Magic Door</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background-color: #f0fdf4; /* Light green background */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden; /* Prevent scrolling on iPad */
        }

        .door-container {
            perspective: 1200px;
            width: clamp(110px, 15vw, 160px);
            height: clamp(190px, 25vh, 280px);
            position: relative;
            margin: 20px 0;
        }

        .door-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e5e7eb; /* Light gray inside */
            border: 12px solid #8B4513; /* SaddleBrown frame */
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* The actual Door that swings */
        .door {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #D2691E; /* Chocolate brown door */
            border: 4px solid #8B4513;
            border-radius: 4px;
            /* Hinge on the right side so it swings out to the right */
            transform-origin: right; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            cursor: pointer;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Doorknob (moved to the left side) */
        .door::before {
            content: '';
            position: absolute;
            left: 10px; /* Knob on the left edge */
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background-color: #FFD700; /* Gold */
            border-radius: 50%;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3), 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* Panels to make it look like a real door */
        .door-panel {
            position: absolute;
            width: 70%;
            height: 35%;
            border: 2px solid #8B4513;
            left: 15%;
            background-color: rgba(139, 69, 19, 0.1);
        }
        .door-panel.top { top: 10%; }
        .door-panel.bottom { bottom: 10%; }

        /* The open state class */
        .door.open {
            /* Swing out to the right */
            transform: rotateY(110deg); 
            box-shadow: 5px 0 15px rgba(0,0,0,0.2);
        }

        /* Typography for the letters */
        .letter {
            font-size: clamp(4rem, 12vh, 7rem);
            font-weight: bold;
            color: #1f2937; /* Dark gray/black */
            position: relative;
        }

        /* Base Word (Onset + Vowel) - stays on the left */
        .base-word-container {
            display: flex;
            align-items: center;
            z-index: 1;
            margin-right: 0px; 
            padding-right: 15px; /* Spacing between vowel and door */
            gap: 2px;
        }

        /* The Consonant (lives on the door) */
        .consonant-container {
            /* Text color matches door when open, changes to black when closing */
            color: #1f2937;
            z-index: 3;
            transition: opacity 0.3s;
        }
        
        .door.open .consonant-container {
            opacity: 0; /* Hide the consonant when door swings away */
        }

        /* Macron (long vowel mark - horizontal line) */
        .macron::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 10%;
            width: 80%;
            height: 6px;
            background-color: #ef4444; /* Red for emphasis */
            border-radius: 3px;
        }

        /* Breve (smile mark - curved) */
        .breve::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 15%;
            width: 70%;
            height: 15px;
            border: 6px solid #ef4444; 
            border-top: none;
            border-radius: 0 0 40px 40px;
        }

        /* Main word display area */
        .word-display-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
        }

        /* Interactive buttons */
        .btn {
            transition: all 0.2s;
            transform: translateY(0);
        }
        .btn:active {
            transform: translateY(2px);
        }
        
        /* Level styling */
        .level-active {
            background-color: #3b82f6; /* Blue-500 */
            color: white;
            border-color: #2563eb;
        }
        .level-inactive {
            background-color: white;
            color: #4b5563;
            border-color: #d1d5db;
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center h-[100dvh] overflow-hidden">

    <header class="w-full bg-blue-600 text-white p-2 md:p-4 shadow-md text-center flex-shrink-0">
        <h1 class="text-2xl md:text-4xl font-bold tracking-wider text-yellow-300 drop-shadow-md">The Syllable Door</h1>
        <p class="text-sm md:text-lg mt-1 md:mt-2">Open for a LONG sound. Close for a SHORT sound!</p>
    </header>

    <main class="flex-grow w-full max-w-4xl p-2 md:p-4 flex flex-col items-center min-h-0">
        
        <!-- Controls & Status -->
        <div class="w-full bg-white rounded-xl shadow-md p-4 mb-2 md:mb-4 flex flex-row justify-between items-center gap-2 flex-shrink-0">
            
            <div class="flex flex-col items-start">
                <span class="text-xs text-gray-500 uppercase tracking-wide font-bold mb-1">Select Level</span>
                <div class="flex gap-1 md:gap-2">
                    <button id="btn-level-1" class="btn px-2 md:px-4 py-1 md:py-2 rounded-lg border-2 font-bold shadow-sm text-sm md:text-base level-active" onclick="setLevel(1)">Level 1<br><span class="text-[10px] md:text-xs font-normal">Real Words</span></button>
                    <button id="btn-level-2" class="btn px-2 md:px-4 py-1 md:py-2 rounded-lg border-2 font-bold shadow-sm text-sm md:text-base level-inactive" onclick="setLevel(2)">Level 2<br><span class="text-[10px] md:text-xs font-normal">Nonsense</span></button>
                    <button id="btn-level-3" class="btn px-2 md:px-4 py-1 md:py-2 rounded-lg border-2 font-bold shadow-sm text-sm md:text-base level-inactive" onclick="setLevel(3)">Level 3<br><span class="text-[10px] md:text-xs font-normal">Mixed</span></button>
                </div>
            </div>

            <div class="flex flex-col items-end gap-1 md:gap-2">
                <div class="bg-blue-50 p-2 md:p-3 rounded-lg border border-blue-100 min-w-[120px] md:min-w-[160px] flex flex-col items-center">
                    <div class="flex justify-between w-full mb-1">
                        <span class="text-xs text-blue-600 font-bold uppercase tracking-wide">Word:</span>
                        <span id="word-counter" class="text-sm md:text-lg font-bold text-blue-800">1 / 30</span>
                    </div>
                    <button onclick="nextWord()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-1 px-4 md:py-2 md:px-6 rounded-full shadow-md btn w-full text-sm md:text-base">Next ➔</button>
                </div>
            </div>
        </div>

        <!-- The Interactive Area -->
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-xl w-full border-4 border-yellow-400 relative flex flex-col items-center flex-grow min-h-0">
            
            <!-- Instructions -->
            <div class="text-center mb-2 flex-shrink-0">
                <h2 id="instruction-text" class="text-lg md:text-2xl font-bold text-gray-700">Click the door to open it!</h2>
            </div>

            <!-- The Visual Representation -->
            <div class="word-display-area min-h-0">
                
                <!-- The Consonant & Vowel (Always on the left) -->
                <div class="base-word-container">
                    <span id="onset-text" class="letter">w</span>
                    <span id="vowel-text" class="letter macron ml-2">e</span>
                </div>

                <!-- The Door Setup (Anchored to the right of the vowel) -->
                <div class="door-container">
                    <!-- Inside the frame (Empty space, reveals when door opens) -->
                    <div class="door-frame"></div>

                    <!-- The Swinging Door (Holds the closing Consonant) -->
                    <!-- Door starts OPEN -->
                    <div id="the-door" class="door open" onclick="toggleDoor()">
                        <div class="door-panel top"></div>
                        <div class="door-panel bottom"></div>
                        <!-- The consonant that closes the syllable -->
                        <span id="coda-text" class="letter consonant-container text-black">t</span>
                    </div>
                </div>
            </div>

            <!-- Self-Check Read Button -->
            <button onclick="playCurrentWordSound()" class="mt-2 mb-2 bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 md:py-3 px-6 md:px-8 rounded-full shadow-lg text-base md:text-xl flex-shrink-0 btn">
                🔊 Check Pronunciation
            </button>

            <!-- Feedback / Explanation Banner -->
            <div id="feedback-banner" class="w-full max-w-2xl bg-blue-100 border-l-8 border-blue-500 p-2 md:p-4 rounded-r-lg shadow-sm flex-shrink-0 transform transition-all duration-300 overflow-y-auto max-h-[120px] md:max-h-[150px]">
                <div class="flex items-center gap-2 md:gap-4">
                    <div id="feedback-icon" class="text-2xl md:text-4xl">🚪</div>
                    <div>
                        <h3 id="feedback-title" class="text-base md:text-xl font-bold text-blue-800">Open Syllable</h3>
                        <p id="feedback-desc" class="text-sm md:text-lg text-blue-900 mt-1">The door is open! The vowel <span class="font-bold underline text-red-600" id="feedback-vowel">e</span> can shout its long name.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- Data Structure ---
        // onset: Starting consonant(s)
        // vowel: Vowel character
        // coda: Closing consonant on the door
        // openPronunciation: Custom spelling for TTS to read the long vowel sound correctly (e.g. "go" needs to be read with long o)
        // closedPronunciation: Custom spelling for TTS to read the short vowel sound (e.g. "got")
        
        const wordDatabase = {
            level1: [ // Real Words
                { onset: "w", vowel: "e", coda: "t", openPronunciation: "we", closedPronunciation: "wet" },
                { onset: "h", vowel: "e", coda: "n", openPronunciation: "he", closedPronunciation: "hen" },
                { onset: "m", vowel: "e", coda: "n", openPronunciation: "me", closedPronunciation: "men" },
                { onset: "sh", vowel: "e", coda: "d", openPronunciation: "she", closedPronunciation: "shed" },
                { onset: "b", vowel: "e", coda: "d", openPronunciation: "be", closedPronunciation: "bed" },
                { onset: "g", vowel: "o", coda: "t", openPronunciation: "go", closedPronunciation: "got" },
                { onset: "n", vowel: "o", coda: "t", openPronunciation: "no", closedPronunciation: "not" },
                { onset: "s", vowel: "o", coda: "b", openPronunciation: "so", closedPronunciation: "sob" },
                { onset: "h", vowel: "i", coda: "d", openPronunciation: "high", closedPronunciation: "hid" },
                { onset: "fl", vowel: "u", coda: "b", openPronunciation: "flew", closedPronunciation: "flub" },
                { onset: "m", vowel: "e", coda: "t", openPronunciation: "me", closedPronunciation: "met" },
                { onset: "w", vowel: "e", coda: "b", openPronunciation: "we", closedPronunciation: "web" },
                { onset: "n", vowel: "o", coda: "d", openPronunciation: "no", closedPronunciation: "nod" },
                { onset: "s", vowel: "o", coda: "ck", openPronunciation: "so", closedPronunciation: "sock" },
                { onset: "g", vowel: "o", coda: "b", openPronunciation: "go", closedPronunciation: "gob" },
                { onset: "pr", vowel: "o", coda: "p", openPronunciation: "pro", closedPronunciation: "prop" },
                { onset: "h", vowel: "i", coda: "t", openPronunciation: "high", closedPronunciation: "hit" },
                { onset: "h", vowel: "i", coda: "p", openPronunciation: "high", closedPronunciation: "hip" },
                { onset: "h", vowel: "o", coda: "p", openPronunciation: "hoe", closedPronunciation: "hop" },
                { onset: "b", vowel: "e", coda: "g", openPronunciation: "be", closedPronunciation: "beg" },
                { onset: "b", vowel: "i", coda: "t", openPronunciation: "bye", closedPronunciation: "bit" },
                { onset: "fr", vowel: "o", coda: "g", openPronunciation: "froh", closedPronunciation: "frog" },
                { onset: "y", vowel: "o", coda: "n", openPronunciation: "yo", closedPronunciation: "yon" },
                { onset: "gl", vowel: "u", coda: "m", openPronunciation: "glue", closedPronunciation: "glum" },
                { onset: "sp", vowel: "u", coda: "d", openPronunciation: "spew", closedPronunciation: "spud" },
                { onset: "pl", vowel: "u", coda: "m", openPronunciation: "ploo", closedPronunciation: "plum" },
                { onset: "sh", vowel: "e", coda: "ll", openPronunciation: "she", closedPronunciation: "shell" },
                { onset: "z", vowel: "i", coda: "p", openPronunciation: "zye", closedPronunciation: "zip" },
                { onset: "cl", vowel: "i", coda: "p", openPronunciation: "clye", closedPronunciation: "clip" },
                { onset: "gr", vowel: "a", coda: "b", openPronunciation: "gray", closedPronunciation: "grab" }
            ],
            level2: [ // Nonsense Words (Alien words) - Requires pronunciation hacks for TTS
                { onset: "r", vowel: "o", coda: "p", openPronunciation: "row", closedPronunciation: "rop" },
                { onset: "z", vowel: "e", coda: "b", openPronunciation: "zee", closedPronunciation: "zeb" },
                { onset: "v", vowel: "a", coda: "m", openPronunciation: "vay", closedPronunciation: "vam" }, 
                { onset: "k", vowel: "i", coda: "p", openPronunciation: "kye", closedPronunciation: "kip" },
                { onset: "t", vowel: "u", coda: "z", openPronunciation: "too", closedPronunciation: "tuz" },
                { onset: "th", vowel: "e", coda: "g", openPronunciation: "thee", closedPronunciation: "theg" }, 
                { onset: "ch", vowel: "o", coda: "m", openPronunciation: "cho", closedPronunciation: "chom" },
                { onset: "p", vowel: "e", coda: "v", openPronunciation: "pee", closedPronunciation: "pev" },
                { onset: "sn", vowel: "i", coda: "g", openPronunciation: "snye", closedPronunciation: "snig" },
                { onset: "dr", vowel: "o", coda: "z", openPronunciation: "droe", closedPronunciation: "droz" },
                { onset: "b", vowel: "a", coda: "f", openPronunciation: "bay", closedPronunciation: "baf" },
                { onset: "j", vowel: "e", coda: "p", openPronunciation: "jee", closedPronunciation: "jep" },
                { onset: "l", vowel: "i", coda: "b", openPronunciation: "lye", closedPronunciation: "lib" },
                { onset: "v", vowel: "o", coda: "b", openPronunciation: "voe", closedPronunciation: "vob" },
                { onset: "g", vowel: "u", coda: "p", openPronunciation: "goo", closedPronunciation: "gup" },
                { onset: "z", vowel: "a", coda: "t", openPronunciation: "zay", closedPronunciation: "zat" },
                { onset: "w", vowel: "i", coda: "b", openPronunciation: "wye", closedPronunciation: "wib" },
                { onset: "fl", vowel: "e", coda: "m", openPronunciation: "flee", closedPronunciation: "flem" },
                { onset: "st", vowel: "o", coda: "g", openPronunciation: "stoe", closedPronunciation: "stog" },
                { onset: "cr", vowel: "u", coda: "p", openPronunciation: "croo", closedPronunciation: "crup" },
                { onset: "m", vowel: "a", coda: "z", openPronunciation: "may", closedPronunciation: "maz" },
                { onset: "sh", vowel: "a", coda: "b", openPronunciation: "shay", closedPronunciation: "shab" },
                { onset: "tr", vowel: "i", coda: "d", openPronunciation: "try", closedPronunciation: "trid" },
                { onset: "n", vowel: "u", coda: "f", openPronunciation: "noo", closedPronunciation: "nuf" },
                { onset: "pl", vowel: "o", coda: "n", openPronunciation: "ploe", closedPronunciation: "plon" },
                { onset: "cl", vowel: "a", coda: "g", openPronunciation: "clay", closedPronunciation: "clag" },
                { onset: "dw", vowel: "e", coda: "p", openPronunciation: "dwee", closedPronunciation: "dwep" },
                { onset: "gl", vowel: "i", coda: "p", openPronunciation: "glye", closedPronunciation: "glip" },
                { onset: "fr", vowel: "e", coda: "b", openPronunciation: "free", closedPronunciation: "freb" },
                { onset: "y", vowel: "u", coda: "t", openPronunciation: "yoo", closedPronunciation: "yut" }
            ]
        };

        // --- State Variables ---
        let currentLevel = 1;
        let currentWordList = [];
        let currentWordIndex = 0;
        let isDoorOpen = true;
        let currentWordObj = null;
        let speechSynth = window.speechSynthesis;

        // --- DOM Elements ---
        const doorEl = document.getElementById('the-door');
        const onsetText = document.getElementById('onset-text');
        const vowelText = document.getElementById('vowel-text');
        const codaText = document.getElementById('coda-text');
        const instructionText = document.getElementById('instruction-text');
        const wordCounter = document.getElementById('word-counter');
        
        const feedbackBanner = document.getElementById('feedback-banner');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDesc = document.getElementById('feedback-desc');
        const feedbackVowel = document.getElementById('feedback-vowel');

        // Shuffle utility
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Function to read text aloud using Web Speech API (Triggered manually for self-check)
        function playCurrentWordSound() {
            if (!speechSynth || !currentWordObj) return; // Browser doesn't support TTS or no word loaded

            // Cancel any ongoing speech
            speechSynth.cancel();

            const textToRead = isDoorOpen ? currentWordObj.openPronunciation : currentWordObj.closedPronunciation;

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.rate = 0.8; // Speak slightly slower for early readers
            utterance.pitch = 1.1; // Slightly higher pitch for a friendly tone
            
            speechSynth.speak(utterance);
        }

        // Setup a specific level
        function setLevel(level) {
            currentLevel = level;
            
            // Update UI buttons
            document.querySelectorAll('[id^="btn-level-"]').forEach(btn => {
                btn.classList.remove('level-active');
                btn.classList.add('level-inactive');
            });
            document.getElementById(`btn-level-${level}`).classList.remove('level-inactive');
            document.getElementById(`btn-level-${level}`).classList.add('level-active');

            // Build word list based on level
            if (level === 1) {
                currentWordList = shuffleArray([...wordDatabase.level1]);
            } else if (level === 2) {
                currentWordList = shuffleArray([...wordDatabase.level2]);
            } else if (level === 3) {
                // Mix of both
                currentWordList = shuffleArray([...wordDatabase.level1, ...wordDatabase.level2]).slice(0, 30); // Take 30 random words
            }

            currentWordIndex = 0;
            loadWord();
        }

        // Load the current word into the UI
        function loadWord() {
            if (currentWordIndex >= currentWordList.length) {
                // Reshuffle and start over if they reach the end
                currentWordList = shuffleArray([...currentWordList]);
                currentWordIndex = 0;
            }

            currentWordObj = currentWordList[currentWordIndex];
            
            // Update text elements
            onsetText.textContent = currentWordObj.onset;
            vowelText.textContent = currentWordObj.vowel;
            codaText.textContent = currentWordObj.coda;
            
            // Reset to OPEN state for new words
            isDoorOpen = true;
            doorEl.classList.add('open');
            updateVisuals();

            // Auto-reading removed so students can self-check!

            // Update counter
            wordCounter.textContent = `${currentWordIndex + 1} / ${currentWordList.length}`;
        }

        // Handle door click
        function toggleDoor() {
            isDoorOpen = !isDoorOpen;
            
            if (isDoorOpen) {
                doorEl.classList.add('open');
                // Auto-reading removed
            } else {
                doorEl.classList.remove('open');
                // Auto-reading removed
            }
            
            updateVisuals();
        }

        // Move to next word
        function nextWord() {
            currentWordIndex++;
            loadWord();
        }

        // Update markings and feedback based on door state
        function updateVisuals() {
            const vowel = currentWordObj.vowel;
            
            if (isDoorOpen) {
                // OPEN SYLLABLE
                instructionText.textContent = "Click the door to close it!";
                
                // Set markings (Macron/Straight line for long vowels)
                vowelText.className = 'letter macron ml-2'; 
                
                // Update Feedback
                feedbackBanner.className = "mt-8 w-full max-w-2xl bg-blue-100 border-l-8 border-blue-500 p-4 rounded-r-lg shadow-sm";
                feedbackIcon.textContent = "🚪💨"; // Open door emoji
                feedbackTitle.textContent = "Open Syllable";
                feedbackTitle.className = "text-xl font-bold text-blue-800";
                feedbackDesc.className = "text-lg text-blue-900 mt-1";
                feedbackVowel.textContent = vowel;
                
                // Read the word logic (visual representation only here)
                const fullWordOpen = currentWordObj.onset + vowel;
                feedbackDesc.innerHTML = `The door is open! Nothing is blocking the vowel. <br>The vowel <span class="font-bold text-red-600 underline text-2xl uppercase">${vowel}</span> makes its <b>LONG</b> sound (says its name).<br><span class="text-xl font-bold bg-white px-2 py-1 rounded mt-2 inline-block">Word: ${fullWordOpen}</span>`;

            } else {
                // CLOSED SYLLABLE
                instructionText.textContent = "Click the door to open it!";
                
                // Set markings (Breve/Smile for short vowels)
                vowelText.className = 'letter breve ml-2'; 
                
                // Update Feedback
                feedbackBanner.className = "mt-8 w-full max-w-2xl bg-purple-100 border-l-8 border-purple-500 p-4 rounded-r-lg shadow-sm";
                feedbackIcon.textContent = "🛑🚪"; // Stop/Closed door emoji
                feedbackTitle.textContent = "Closed Syllable";
                feedbackTitle.className = "text-xl font-bold text-purple-800";
                feedbackDesc.className = "text-lg text-purple-900 mt-1";
                feedbackVowel.textContent = vowel;
                
                const fullWordClosed = currentWordObj.onset + vowel + currentWordObj.coda;
                feedbackDesc.innerHTML = `The door is closed! The consonant <span class="font-bold text-black text-xl uppercase">${currentWordObj.coda}</span> blocked the vowel.<br>The vowel <span class="font-bold text-red-600 underline text-2xl uppercase">${vowel}</span> makes its <b>SHORT</b> sound.<br><span class="text-xl font-bold bg-white px-2 py-1 rounded mt-2 inline-block">Word: ${fullWordClosed}</span>`;
            }
        }

        // Initialize on load
        window.onload = function() {
            setLevel(1); // Start at level 1
        };

    </script>
</body>
</html>
